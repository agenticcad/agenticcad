# Briefcase packaging for the AgenticCAD desktop app (macOS .dmg, Windows .msi; Linux later).
#   .venv/bin/briefcase create macOS && .venv/bin/briefcase build macOS && .venv/bin/briefcase package macOS --adhoc-sign
# Claude Code is deliberately NOT bundled (see cleanup_paths): users install it separately and the app finds it.
# Keep `version` in sync with version.py (tools/release.sh checks).

# PEP 621/639 metadata: Briefcase's Windows installer reads the licence file list from here.
[project]
name = "agenticcad"
version = "1.9.10"
description = "Agent-native CAD/CAM: describe it, point at it, export STEP, STL and G-code"
license = "PolyForm-Noncommercial-1.0.0"
license-files = ["packaging/INSTALLER-TERMS.txt", "LICENSE"]   # Windows MSI licence page: Briefcase merges these into LICENSE.rtf
requires-python = ">=3.12"

[tool.briefcase]
project_name = "AgenticCAD"
bundle = "au.com.prodevelop"
version = "1.9.10"
url = "https://agenticcad.github.io/agenticcad/"
author = "Mike Orzel"
author_email = "agenticcad@prodevelop.com.au"

[tool.briefcase.app.agenticcad]
formal_name = "AgenticCAD"
description = "Agent-native CAD/CAM: describe it, point at it, export STEP, STL and G-code"
long_description = """AgenticCAD is a CAD/CAM workspace with a Claude agent inside it. Describe a part and the agent
writes it as build123d code; the exact OCCT kernel builds it and the viewer shows it live. Point at faces to steer
it, tweak by hand with a Fusion-style ribbon, then export STEP/STL, shop drawings or GRBL G-code.

Requires Claude Code (installed and signed in separately). Free for non-commercial use.
"""
icon = "src/agenticcad/resources/agenticcad"
sources = [
    "src/agenticcad",
    "server.py", "agent.py", "cad_kernel.py", "cam_kernel.py", "cam_rotary.py", "cam_sim.py", "cam_stamp.py", "cam_data.py", "drawing.py", "features.py", "analysis.py", "motion.py", "sketch_solver.py", "extensions.py", "ext_builtin", "machine_models.py", "machine_script.py", "machine_link.py", "run_recorder.py", "run_analysis.py", "share.py", "lessons.py", "dream.py", "power.py", "phone_push.py", "tool_shape.py", "machine_scripts", "machine_data", "fixture_lib.py", "fixture_scripts",
    "gears.py", "library.py", "script_edit.py", "slicer.py", "threads.py", "units.py", "version.py", "designkit",
    "static", "CHANGELOG.md",
]
requires = [
    "bd_warehouse==0.3.0",
    "build123d==0.11.1",
    "claude-agent-sdk==0.2.152",
    # cryptography 49+ has no Intel Mac wheels (Briefcase installs wheels only): Intel Macs get 48.0.1. Its open advisories
    # (x509 chain verification, PKCS#7 decryption) don't reach us: we only make our own certs, sign and AES-GCM
    "cryptography==50.0.1; sys_platform != 'darwin' or platform_machine != 'x86_64'",
    "cryptography==48.0.1; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "certifi==2026.10.23",
    "fastapi==0.141.1",
    "httpx2==2.12.0",
    "numpy==2.5.2",
    "pydantic==2.13.5",
    "shapely==2.1.2",
    "uvicorn==0.52.4",
    "websockets==17.1",
    "platformdirs==4.11.12",
    # the simulator's faster back ends (cam_stamp.py; both optional: the numpy code runs without them). numba 0.68 has
    # wheels for numpy 2.5 on Apple silicon and Windows x86_64 only (Intel Macs stop at 0.62, Linux at 0.67 as of
    # 2026-11); metalcompute 0.2.9 is arm64-only (Intel Macs get 0.2.5, the same API)
    "numba==0.68.1; (sys_platform == 'darwin' and platform_machine == 'arm64') or (sys_platform == 'win32' and platform_machine == 'AMD64')",
    "metalcompute==0.2.9; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "metalcompute==0.2.5; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "pywebview==6.2.1",
    # pure-python dependency of pywebview published only as an sdist; Briefcase installs wheels only
    "./wheels/proxy_tools-0.1.0-py3-none-any.whl",
]
# The Claude Agent SDK wheel ships a 200 MB Claude Code binary. We do not redistribute it: the desktop app
# uses the user's own Claude Code install (found on PATH / in the official install locations).
cleanup_paths = [
    "**/claude_agent_sdk/_bundled",
    "**/__pycache__",
]

[tool.briefcase.app.agenticcad.macOS]
# PKG installer (not DMG; CI passes `-p pkg`) so macOS shows the licence with Agree / Disagree; our LICENSE and welcome
# page overlay the template
installer_resources = "packaging/macos-installer"
universal_build = false
min_os_version = "14.0"   # numpy/scipy arm64 wheels are macosx_14_0
requires = ["pyobjc-core", "pyobjc-framework-Cocoa", "pyobjc-framework-WebKit", "pyobjc-framework-Security"]
# File > Share by email drives Outlook (when it's the default mail app) with AppleScript: macOS asks the user once
info."NSAppleEventsUsageDescription" = "AgenticCAD asks your mail app to open a new email with the design you're sharing attached."
entitlement."com.apple.security.automation.apple-events" = true

[tool.briefcase.app.agenticcad.windows]
console_app = false
requires = ["pythonnet>=3.0", "pywin32"]

# ---- the side-by-side test build (branch multi-design): several designs in tabs. Its own bundle id, data folder
# and ports, so it installs next to AgenticCAD without touching it.
[tool.briefcase.app.agenticcad.linux]
supported = false
