# Install the released Windows MSI on a clean Windows runner and smoke-test the installed app through its local API.
# Runs after every package build, or by hand for any release tag. Free on this public repo (Actions minutes);
# the agent test spends a few cents of API usage from the ANTHROPIC_API_KEY secret, which forks never receive.
name: smoke-windows
on:
  workflow_dispatch:
    inputs:
      tag: { description: "Release tag to test (e.g. v0.16.1)", required: true }
  workflow_call:
    inputs:
      tag: { type: string, required: true }
    secrets:
      ANTHROPIC_API_KEY: { required: false }
permissions:
  contents: read
jobs:
  install-and-run:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install websocket-client
      - name: download the installer from the release
        shell: bash
        env: { GH_TOKEN: "${{ github.token }}" }
        run: gh release download "${{ inputs.tag }}" -R "${{ github.repository }}" -p '*.msi' -D dist && ls -la dist
      - name: install silently, like a user would (licence accepted by /qn)
        shell: pwsh
        run: |
          $msi = (Get-ChildItem dist\*.msi)[0].FullName
          $p = Start-Process msiexec.exe -ArgumentList "/i `"$msi`" /qn /l*v install.log" -Wait -PassThru
          "msiexec exit code: $($p.ExitCode)"
          if ($p.ExitCode -ne 0) { Get-Content install.log -Tail 60; exit 1 }
          $exe = Get-ChildItem -Recurse -Filter AgenticCAD.exe -ErrorAction SilentlyContinue "$env:ProgramFiles", "$env:LOCALAPPDATA\Programs" | Select-Object -First 1
          if (-not $exe) { "AgenticCAD.exe not found"; exit 1 }
          "installed at $($exe.FullName)"
          "EXE=$($exe.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: install Claude Code (Anthropic's Windows installer), as users do
        shell: pwsh
        run: |
          irm https://claude.ai/install.ps1 | iex
          & "$env:USERPROFILE\.local\bin\claude.exe" --version
      - name: start the installed app and smoke-test it (one step, the runner kills leftover processes between steps)
        shell: pwsh
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}   # read only by agent_smoke.py; the app gets it via Settings, not its env
        run: |
          $key = $env:ANTHROPIC_API_KEY; Remove-Item Env:ANTHROPIC_API_KEY -ErrorAction SilentlyContinue   # keep it out of the app's environment
          $env:AGENTICCAD_WORKSPACE = "$env:RUNNER_TEMP\agenticcad-ws"; $env:PORT = "8799"
          $proc = Start-Process -FilePath $env:EXE -PassThru -RedirectStandardOutput app-out.log -RedirectStandardError app-err.log
          $up = $false
          for ($i = 0; $i -lt 120; $i++) {
            try { Invoke-RestMethod http://127.0.0.1:8799/api/version -TimeoutSec 2 | Out-Null; $up = $true; break } catch { Start-Sleep 1 }
            if ($proc.HasExited) { break }
          }
          if (-not $up) { "server did not come up (exited: $($proc.HasExited) code: $($proc.ExitCode))"; exit 1 }
          "server up after $i s; app still running: $(-not $proc.HasExited)"
          python tools/ci/smoke.py http://127.0.0.1:8799 "${{ inputs.tag }}"
          $rc = $LASTEXITCODE
          if ($rc -eq 0) { $env:ANTHROPIC_API_KEY = $key; python tools/ci/agent_smoke.py http://127.0.0.1:8799; $rc = $LASTEXITCODE }   # skips itself without the secret
          "app still running after the tests: $(-not $proc.HasExited)"
          exit $rc
      - name: app logs
        if: always()
        shell: pwsh
        run: Get-Content app-out.log, app-err.log -ErrorAction SilentlyContinue | Select-Object -Last 80
