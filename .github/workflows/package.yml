# Build the desktop installers when a release is published (tools/release.sh) and attach them to it.
# Unsigned for now: macOS is ad-hoc signed (Gatekeeper warns), Windows MSI is unsigned (SmartScreen warns).
# Claude Code is not bundled (pyproject cleanup_paths strips the SDK's copy); users install it separately.
name: package
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to attach installers to (e.g. v0.9.2)"
        required: true
permissions:
  contents: write
jobs:
  macos-arm64:
    runs-on: macos-14
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install briefcase==0.4.5
      - run: briefcase create macOS --no-input
      - run: briefcase build macOS --no-input
      - run: briefcase package macOS --adhoc-sign --no-input
      - name: rename with architecture
        run: for f in dist/*.dmg; do mv "$f" "${f%.dmg}-macOS-arm64.dmg"; done; ls -la dist
      - name: upload to release
        env: { GH_TOKEN: "${{ github.token }}" }
        run: gh release upload "${{ github.event.release.tag_name || inputs.tag }}" dist/*.dmg --clobber
  windows-x64:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install briefcase==0.4.5
      - run: briefcase create windows --no-input
      - run: briefcase build windows --no-input
      - run: briefcase package windows --adhoc-sign --no-input
      - name: rename with architecture
        shell: bash
        run: for f in dist/*.msi; do mv "$f" "${f%.msi}-Windows-x64.msi"; done; ls -la dist
      - name: upload to release
        shell: bash
        env: { GH_TOKEN: "${{ github.token }}" }
        run: gh release upload "${{ github.event.release.tag_name || inputs.tag }}" dist/*.msi --clobber
