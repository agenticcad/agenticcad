# Build the desktop installers when a release is published (tools/release.sh) and attach them to it.
# macOS: one .pkg for Apple silicon (arm64) and one for Intel (x64). Unsigned for now: macOS is ad-hoc signed (Gatekeeper warns), Windows MSI is unsigned (SmartScreen warns).
# Both installers show the licence (packaging/INSTALLER-TERMS.txt + LICENSE) with Agree / I accept: macOS ships a .pkg
# (`-p pkg` below) because a .dmg can't carry a licence step; the Windows MSI template has a licence dialog.
# Claude Code is not bundled (pyproject cleanup_paths strips the SDK's copy); users install it separately.
name: package
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to attach installers to (e.g. v0.9.2); built from that tag"
        required: true
      only:
        description: "Build just one installer"
        type: choice
        default: all
        options: [all, macos, windows-x64]
permissions:
  contents: write
jobs:
  macos:
    # Apple silicon and Intel Macs each get their own .pkg (universal_build is off: the CAD kernel wheels are per-arch)
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: arm64, runner: macos-15 }
          - { arch: x64, runner: macos-15-intel }
    if: github.event_name == 'release' || inputs.only == 'all' || inputs.only == 'macos'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ github.event.release.tag_name || inputs.tag }}" }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install briefcase==0.4.5
      - run: briefcase create macOS --no-input
      - run: briefcase build macOS --no-input
      - run: briefcase package macOS -p pkg --adhoc-sign --no-input
      - name: check the licence step is in the installer
        run: |
          f=$(ls dist/*.pkg); rm -rf /tmp/x && pkgutil --expand "$f" /tmp/x
          grep -q 'license file="LICENSE"' /tmp/x/Distribution && grep -q "Commercial use needs a licence" /tmp/x/Resources/LICENSE && echo "licence OK"
      - name: check every compiled module is built for this architecture
        run: |
          want=$([ "${{ matrix.arch }}" = x64 ] && echo x86_64 || echo arm64)
          bad=$(find build/agenticcad/macos/app \( -name '*.so' -o -name '*.dylib' \) | while read -r f; do
            a=" $(lipo -archs "$f" 2>/dev/null) "; case "$a" in *" $want "*) ;; *) echo "$f:$a";; esac; done)
          [ -z "$bad" ] || { echo "not built for $want:"; echo "$bad"; exit 1; }; echo "all modules include $want"
      - name: rename with architecture
        run: for f in dist/*.pkg; do mv "$f" "${f%.pkg}-macOS-${{ matrix.arch }}.pkg"; done; ls -la dist
      - name: upload to release
        env: { GH_TOKEN: "${{ github.token }}" }
        run: gh release upload "${{ github.event.release.tag_name || inputs.tag }}" dist/*.pkg --clobber
  windows-x64:
    if: github.event_name == 'release' || inputs.only == 'all' || inputs.only == 'windows-x64'
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ github.event.release.tag_name || inputs.tag }}" }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install briefcase==0.4.5
      - run: briefcase create windows --no-input
      - name: check the licence text for the installer dialog
        shell: bash
        run: f=$(find build -name LICENSE.rtf | head -1); echo "$f"; grep -q "Commercial use needs a licence" "$f" && grep -q "PolyForm Noncommercial" "$f" && echo "licence OK"
      - run: briefcase build windows --no-input
      - run: briefcase package windows --adhoc-sign --no-input
      - name: rename with architecture
        shell: bash
        run: for f in dist/*.msi; do mv "$f" "${f%.msi}-Windows-x64.msi"; done; ls -la dist
      - name: upload to release
        shell: bash
        env: { GH_TOKEN: "${{ github.token }}" }
        run: gh release upload "${{ github.event.release.tag_name || inputs.tag }}" dist/*.msi --clobber
  windows-smoke:
    needs: windows-x64
    uses: ./.github/workflows/smoke-windows.yml
    secrets: inherit
    with:
      tag: ${{ github.event.release.tag_name || inputs.tag }}
